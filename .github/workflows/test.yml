name: test
on:
  push:
  # ⚠ push 契機だけだと、更新が止まったときに赤へ気づけない。
  # このリポジトリは 2025-09-15 以降 push が無く、CI も 2026-02-21 の run で
  # 緑のまま止まっていた。その間に rubocop の指摘が溜まっていた（#8）。
  schedule:
    - cron: '25 0 * * 1'
  # ⚠ schedule: は 60 日の無活動で GitHub に無効化される。ginseng-style の
  # gem-watch から起こせるようにしておく。
  workflow_dispatch:
# ⚠⚠ 手順本体は pooza/ginseng-style の composite action。版で固定しているが、
# そこに入った変更が、このリポジトリの GITHUB_TOKEN を持って動く。既定に頼らず絞る。
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - ruby:3.4
          - ruby:4.0
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 既定では認証情報がワークツリーの git config に残る。依存 gem は
          # public な github: 参照なので、消しても bundle install に影響しない。
          persist-credentials: false
      # ⚠ 手順の正本は pooza/ginseng-style。ここには matrix と schedule だけ置く。
      - uses: pooza/ginseng-style/.github/actions/ruby-check@v1.1.4
        with:
          # ⚠⚠ 16 件のうち 11 件が Google の YouTube Data API を実際に叩く。
          # API キーは gitignore された config/local.yaml にあり CI には無い。
          # 方針が決まるまで保留する。詳細と選択肢は #9 にある。
          test: 'false'
